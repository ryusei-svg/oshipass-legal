<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>学会ポケット Web版｜タイテグリッド</title>
  <meta name="description" content="学会・研究大会のプログラムをタイムテーブル形式で見られる非公式アプリ「学会ポケット」のWeb版です。">
  <link rel="canonical" href="https://oshibul.jp/gakkaipocket/web/">

  <!-- SNS・メッセージアプリでセッションのリンクを共有したときのプレビュー。
       ハッシュ以降(#/e/... )はクローラに渡らないため、大会ごとの出し分けはできない。
       ここではサービス全体の紹介として固定の内容を返す。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="学会ポケット">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://oshibul.jp/gakkaipocket/web/">
  <meta property="og:title" content="学会ポケット Web版｜演題をえらんで、当日スムーズに。">
  <meta property="og:description" content="学会・研究大会のプログラムをブラウザでそのまま。聴きたい演題をマークして自分だけのタイムテーブルをつくれます。インストール不要・登録不要・広告なし。">
  <meta property="og:image" content="https://oshibul.jp/gakkaipocket/assets/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="学会ポケットの紹介画像。マイタイテ画面と当日ビュー画面が並んでいる">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
  <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="gp-shell">
    <header class="gp-header">
      <div class="gp-header-inner">
        <span class="gp-app-name">学会ポケット</span>
        <span class="gp-web-badge">Web版</span>
      </div>
      <div class="gp-event-header" id="event-header" hidden></div>
      <nav class="gp-day-tabs" id="day-tabs" aria-label="日程切り替え" hidden></nav>
    </header>

    <main class="gp-main" id="grid-root">
      <p class="gp-status" id="grid-status">プログラム情報を読み込んでいます…</p>
      <div class="tt-viewport" id="grid-container"></div>
    </main>

    <!--
      非公式である旨(gp-about-trigger)は法務要件のため常時表示のままとし、
      画面の縦を圧迫する補足説明と公式サイトリンクのみを折りたたむ。
    -->
    <footer class="gp-footer">
      <p class="gp-footer-notice">
        <button type="button" id="gp-about-trigger" class="gp-about-trigger">本アプリは大会主催者・運営とは関係のない非公式アプリです。</button>
        <button type="button" id="gp-footer-toggle" class="gp-footer-toggle" aria-expanded="false" aria-controls="gp-footer-details" aria-label="出典と注意事項を開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="7 10 12 15 17 10"></polyline></svg>
        </button>
      </p>
      <div class="gp-footer-details" id="gp-footer-details" hidden>
        <p class="gp-footer-detail-text" id="gp-event-footer-detail"><span id="gp-event-name"></span>の掲載情報は公式サイトの発表をもとに作成しています。最新かつ正確な情報は必ず公式サイトをご確認ください。</p>
        <p class="gp-footer-links">
          <a id="gp-official-link" href="#" target="_blank" rel="noopener"></a>
          <!-- 紹介ページへの静的リンク。利用者の導線であると同時に、
               JavaScriptを実行しないクローラにも辿れる唯一の内部リンクになる。 -->
          <a class="gp-footer-home-link" href="../">学会ポケットについて</a>
        </p>
      </div>
    </footer>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
